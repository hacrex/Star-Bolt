<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <linearGradient id="heroGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0A"/>
      <stop offset="50%" style="stop-color:#1C1510"/>
      <stop offset="100%" style="stop-color:#0A0A0A"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:rgba(212,168,67,0.12)"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="albumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A843"/>
      <stop offset="50%" style="stop-color:#8B6914"/>
      <stop offset="100%" style="stop-color:#D4A843"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="900" fill="#0A0A0A"/>

  <!-- Header -->
  <rect width="1280" height="64" fill="rgba(10,10,10,0.85)"/>
  <line x1="0" y1="64" x2="1280" y2="64" stroke="rgba(212,168,67,0.15)" stroke-width="1"/>
  <text x="32" y="42" font-size="22" font-weight="700" fill="#D4A843">&#9733;</text>
  <text x="52" y="42" font-size="18" font-weight="700" fill="#F5F0E8">STARLYRIX</text>
  <text x="200" y="42" font-size="14" fill="#A89F91">Discover</text>
  <text x="280" y="42" font-size="14" fill="#A89F91">AI Lyrics</text>
  <text x="365" y="42" font-size="14" fill="#A89F91">Videos</text>
  <circle cx="1180" cy="32" r="16" fill="#1C1C1C" stroke="#242424" stroke-width="1"/>
  <text x="1175" y="37" font-size="14" fill="#A89F91">&#9789;</text>
  <circle cx="1220" cy="32" r="16" fill="#D4A843"/>
  <text x="1213" y="37" font-size="12" fill="#0A0A0A" font-weight="600">K</text>

  <!-- Breadcrumb / Back -->
  <text x="32" y="96" font-size="13" fill="#6B6560">&#8592; Back to Discover</text>

  <!-- Album Art -->
  <rect x="32" y="120" width="280" height="280" rx="16" fill="url(#albumGrad)"/>
  <text x="172" y="270" text-anchor="middle" font-size="64" fill="#0A0A0A" opacity="0.3">&#9835;</text>
  <text x="172" y="310" text-anchor="middle" font-size="14" fill="#0A0A0A" font-weight="600" opacity="0.5">BRAHMASTRA</text>

  <!-- Song Info -->
  <text x="340" y="155" font-size="32" font-weight="700" fill="#F5F0E8">Kesariya</text>
  <text x="340" y="185" font-size="18" fill="#A89F91">Arijit Singh</text>
  <text x="340" y="210" font-size="14" fill="#6B6560">Brahmastra &#183; 2022 &#183; Romantic</text>

  <!-- Genre Chips -->
  <rect x="340" y="225" width="80" height="28" rx="14" fill="#1C1C1C" stroke="#C4616A" stroke-width="1"/>
  <text x="380" y="244" text-anchor="middle" font-size="11" fill="#C4616A">Romantic</text>

  <rect x="430" y="225" width="60" height="28" rx="14" fill="#1C1C1C" stroke="#242424" stroke-width="1"/>
  <text x="460" y="244" text-anchor="middle" font-size="11" fill="#A89F91">Pop</text>

  <rect x="500" y="225" width="70" height="28" rx="14" fill="#1C1C1C" stroke="#242424" stroke-width="1"/>
  <text x="535" y="244" text-anchor="middle" font-size="11" fill="#A89F91">Hindi</text>

  <!-- Verified Badge -->
  <rect x="340" y="270" width="140" height="28" rx="14" fill="rgba(212,168,67,0.1)"/>
  <text x="360" y="289" font-size="12" fill="#D4A843" font-weight="500">&#10003; Verified Lyrics</text>

  <!-- Action Buttons -->
  <rect x="340" y="310" width="120" height="36" rx="18" fill="#1C1C1C" stroke="#D4A843" stroke-width="1"/>
  <text x="378" y="333" font-size="12" fill="#D4A843">&#9825; Favorite</text>

  <rect x="472" y="310" width="140" height="36" rx="18" fill="#1C1C1C" stroke="#242424" stroke-width="1"/>
  <text x="505" y="333" font-size="12" fill="#A89F91">&#9835; Playlist</text>

  <rect x="624" y="310" width="100" height="36" rx="18" fill="#1C1C1C" stroke="#242424" stroke-width="1"/>
  <text x="658" y="333" font-size="12" fill="#A89F91">&#8599; Share</text>

  <!-- Lyrics Container -->
  <rect x="32" y="420" width="700" height="460" rx="16" fill="#141414" stroke="#242424" stroke-width="1"/>

  <!-- Lyrics Header -->
  <text x="56" y="456" font-size="18" font-weight="600" fill="#F5F0E8">Lyrics</text>
  <line x1="56" y1="468" x2="708" y2="468" stroke="#242424" stroke-width="1"/>

  <!-- Verse 1 Header -->
  <text x="56" y="500" font-size="12" font-weight="600" fill="#D4A843" text-transform="uppercase" letter-spacing="1">Verse 1</text>

  <!-- Lyrics Lines - Normal -->
  <text x="56" y="528" font-size="18" fill="#A89F91" opacity="0.5" font-family="Georgia, serif">Tere sang yaaraa</text>
  <text x="56" y="556" font-size="18" fill="#A89F91" opacity="0.5" font-family="Georgia, serif">Khush rang baaraa</text>
  <text x="56" y="584" font-size="18" fill="#A89F91" opacity="0.5" font-family="Georgia, serif">Rang birangi raat mein</text>
  <text x="56" y="612" font-size="18" fill="#A89F91" opacity="0.5" font-family="Georgia, serif">Dhadke teri baat mein</text>

  <!-- Current Line - Highlighted -->
  <rect x="48" y="624" width="660" height="36" rx="4" fill="url(#goldLine)"/>
  <line x1="52" y1="628" x2="52" y2="656" stroke="#D4A843" stroke-width="3" stroke-linecap="round"/>
  <text x="64" y="650" font-size="20" fill="#D4A843" font-weight="600" font-family="Georgia, serif">Kesariya rang hai tera</text>

  <!-- More Lines -->
  <text x="56" y="692" font-size="18" fill="#A89F91" opacity="0.5" font-family="Georgia, serif">Pyaar ki roshni mein</text>
  <text x="56" y="720" font-size="18" fill="#A89F91" opacity="0.5" font-family="Georgia, serif">Dhalke tu meri zindagi mein</text>
  <text x="56" y="748" font-size="18" fill="#A89F91" opacity="0.5" font-family="Georgia, serif">Chupa hai tu har pal mein</text>

  <!-- Chorus Header -->
  <text x="56" y="788" font-size="12" font-weight="600" fill="#D4A843" letter-spacing="1">Chorus</text>

  <text x="56" y="816" font-size="18" fill="#A89F91" opacity="0.5" font-family="Georgia, serif">Kesariya tera ishq hai piya</text>
  <text x="56" y="844" font-size="18" fill="#A89F91" opacity="0.5" font-family="Georgia, serif">Rang jo tune lagaya</text>

  <!-- Scroll Indicator -->
  <rect x="700" y="500" width="4" height="120" rx="2" fill="#242424"/>
  <rect x="700" y="540" width="4" height="40" rx="2" fill="#D4A843"/>

  <!-- Jump To Pills -->
  <text x="760" y="456" font-size="14" font-weight="600" fill="#F5F0E8">Jump to</text>
  <rect x="760" y="470" width="80" height="32" rx="16" fill="#1C1C1C" stroke="#D4A843" stroke-width="1"/>
  <text x="800" y="491" text-anchor="middle" font-size="11" fill="#D4A843">Verse 1</text>
  <rect x="850" y="470" width="80" height="32" rx="16" fill="#1C1C1C" stroke="#242424" stroke-width="1"/>
  <text x="890" y="491" text-anchor="middle" font-size="11" fill="#A89F91">Chorus</text>
  <rect x="940" y="470" width="70" height="32" rx="16" fill="#1C1C1C" stroke="#242424" stroke-width="1"/>
  <text x="975" y="491" text-anchor="middle" font-size="11" fill="#A89F91">Verse 2</text>
  <rect x="1020" y="470" width="60" height="32" rx="16" fill="#1C1C1C" stroke="#242424" stroke-width="1"/>
  <text x="1050" y="491" text-anchor="middle" font-size="11" fill="#A89F91">Bridge</text>

  <!-- Translations Section -->
  <text x="760" y="540" font-size="14" font-weight="600" fill="#F5F0E8">Translations (12)</text>
  <rect x="760" y="555" width="70" height="28" rx="14" fill="#D4A843"/>
  <text x="795" y="574" text-anchor="middle" font-size="11" fill="#0A0A0A" font-weight="500">English</text>
  <rect x="840" y="555" width="70" height="28" rx="14" fill="#1C1C1C" stroke="#242424" stroke-width="1"/>
  <text x="875" y="574" text-anchor="middle" font-size="11" fill="#A89F91">Hindi</text>
  <rect x="920" y="555" width="80" height="28" rx="14" fill="#1C1C1C" stroke="#242424" stroke-width="1"/>
  <text x="960" y="574" text-anchor="middle" font-size="11" fill="#A89F91">Spanish</text>
  <rect x="1010" y="555" width="80" height="28" rx="14" fill="#1C1C1C" stroke="#242424" stroke-width="1"/>
  <text x="1050" y="574" text-anchor="middle" font-size="11" fill="#A89F91">Korean</text>

  <!-- Related Songs -->
  <text x="760" y="630" font-size="14" font-weight="600" fill="#F5F0E8">Related Songs</text>

  <rect x="760" y="645" width="480" height="60" rx="12" fill="#1C1C1C" stroke="#242424" stroke-width="1"/>
  <rect x="772" y="657" width="40" height="40" rx="8" fill="#141414"/>
  <text x="792" y="682" text-anchor="middle" font-size="16" fill="#D4A843">&#9834;</text>
  <text x="824" y="675" font-size="13" font-weight="600" fill="#F5F0E8">Tum Hi Ho</text>
  <text x="824" y="693" font-size="11" fill="#A89F91">Arijit Singh</text>

  <rect x="760" y="715" width="480" height="60" rx="12" fill="#1C1C1C" stroke="#242424" stroke-width="1"/>
  <rect x="772" y="727" width="40" height="40" rx="8" fill="#141414"/>
  <text x="792" y="752" text-anchor="middle" font-size="16" fill="#D4A843">&#9834;</text>
  <text x="824" y="745" font-size="13" font-weight="600" fill="#F5F0E8">Agar Tum Saath Ho</text>
  <text x="824" y="763" font-size="11" fill="#A89F91">Arijit Singh</text>

  <rect x="760" y="785" width="480" height="60" rx="12" fill="#1C1C1C" stroke="#242424" stroke-width="1"/>
  <rect x="772" y="797" width="40" height="40" rx="8" fill="#141414"/>
  <text x="792" y="822" text-anchor="middle" font-size="16" fill="#D4A843">&#9834;</text>
  <text x="824" y="815" font-size="13" font-weight="600" fill="#F5F0E8">Channa Mereya</text>
  <text x="824" y="833" font-size="11" fill="#A89F91">Arijit Singh</text>

  <!-- Quick Actions Bar -->
  <rect x="32" y="860" width="700" height="40" rx="8" fill="#1C1C1C" stroke="#242424" stroke-width="1"/>
  <text x="72" y="885" font-size="12" fill="#A89F91">&#128203; Copy Lyrics</text>
  <text x="192" y="885" font-size="12" fill="#A89F91">&#128228; Share Quote</text>
  <text x="312" y="885" font-size="12" fill="#A89F91">&#128279; Copy Link</text>
  <text x="412" y="885" font-size="12" fill="#A89F91">&#128190; Download</text>
  <text x="512" y="885" font-size="12" fill="#A89F91">&#128680; Report</text>

  <!-- Reading Mode Toggle -->
  <rect x="1200" y="860" width="52" height="40" rx="8" fill="#D4A843"/>
  <text x="1216" y="885" font-size="12" fill="#0A0A0A" font-weight="600">Aa</text>
</svg>
